<div style="text-align: center; margin-top: 4em;">
  <h1 class="bold" style="font-family:Calibri;">Administración</h1>
</div>

<div style="margin-left:5%; margin-right:5%; margin-top:2em; margin-bottom:4em">
  <mat-tab-group>
    <mat-tab label="Categorías">
      <div style="margin-top:2em; display:flex; flex-wrap:wrap; gap:2em">
        <form [formGroup]="formCategory" (ngSubmit)="submitCategory()" style="min-width:250px">
          <mat-form-field appearance="outline" class="example-full-width">
            <mat-label style="color: #828282">Nombre de la categoría</mat-label>
            <input style="color: #828282" matInput formControlName="name" />
          </mat-form-field>
          <div style="display:flex; gap:1em">
            <button type="submit" style="background-color: #D9697D; color: white;" class="btn shadow" mat-flat-button [disabled]="formCategory.invalid">
              {{editingCategoryId ? 'Guardar cambios' : 'Crear categoría'}}
            </button>
            <button *ngIf="editingCategoryId" type="button" class="btn shadow" mat-flat-button (click)="resetCategoryForm()">Cancelar</button>
          </div>
        </form>
      </div>

      <div style="margin-top:2em; border-radius:10px; padding:24px" class="mat-elevation-z8 shadow">
        <table mat-table [dataSource]="categories" style="background-color:white; width:100%">
          <ng-container matColumnDef="name">
            <th class="bold" style="color:black" mat-header-cell *matHeaderCellDef>Nombre</th>
            <td style="color:black" mat-cell *matCellDef="let c">{{c.name}}</td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let c">
              <button mat-icon-button (click)="editCategory(c)" aria-label="Editar"><mat-icon>edit</mat-icon></button>
              <button mat-icon-button (click)="deleteCategory(c.id)" aria-label="Eliminar"><mat-icon>delete</mat-icon></button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="['name', 'actions']"></tr>
          <tr mat-row *matRowDef="let row; columns: ['name', 'actions'];"></tr>
        </table>
      </div>
    </mat-tab>

    <mat-tab label="Skins">
      <div style="margin-top:2em; display:flex; flex-wrap:wrap; gap:1em; align-items:flex-start">
        <form [formGroup]="formSkin" (ngSubmit)="submitSkin()" style="display:flex; flex-wrap:wrap; gap:1em; align-items:flex-start">
          <mat-form-field appearance="outline">
            <mat-label style="color: #828282">Nombre</mat-label>
            <input style="color: #828282" matInput formControlName="name" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label style="color: #828282">Rareza</mat-label>
            <input style="color: #828282" matInput formControlName="rarity" />
          </mat-form-field>
          <mat-form-field appearance="outline" style="max-width:120px">
            <mat-label style="color: #828282">Float</mat-label>
            <input style="color: #828282" matInput type="number" step="0.01" formControlName="skinFloat" />
          </mat-form-field>
          <mat-form-field appearance="outline" style="max-width:120px">
            <mat-label style="color: #828282">Patrón</mat-label>
            <input style="color: #828282" matInput type="number" formControlName="pattern" />
          </mat-form-field>
          <mat-form-field appearance="outline" style="max-width:140px">
            <mat-label style="color: #828282">Precio</mat-label>
            <input style="color: #828282" matInput type="number" step="0.01" formControlName="price" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label style="color: #828282">Categoría</mat-label>
            <mat-select formControlName="categoryId">
              <mat-option *ngFor="let cat of categories" [value]="cat.id">{{cat.name}}</mat-option>
            </mat-select>
          </mat-form-field>
          <div style="display:flex; gap:1em; align-items:center; height:56px">
            <img *ngIf="skinPhotoPreview" [src]="skinPhotoPreview" style="width:50px; height:50px; border-radius:6px; object-fit:cover" />
            <input #skinPhotoInput type="file" accept="image/*" hidden (change)="onSkinPhotoSelected($event)" />
            <button type="button" class="btn shadow" mat-flat-button (click)="triggerSkinPhotoInput()">Cargar foto</button>
          </div>
          <div style="display:flex; gap:1em; align-items:center; height:56px">
            <button type="submit" style="background-color: #D9697D; color: white;" class="btn shadow" mat-flat-button [disabled]="formSkin.invalid">
              {{editingSkinId ? 'Guardar cambios' : 'Crear skin'}}
            </button>
            <button *ngIf="editingSkinId" type="button" class="btn shadow" mat-flat-button (click)="resetSkinForm()">Cancelar</button>
          </div>
        </form>
      </div>

      <div style="margin-top:2em; border-radius:10px; padding:24px" class="mat-elevation-z8 shadow">
        <table mat-table [dataSource]="skins" style="background-color:white; width:100%">
          <ng-container matColumnDef="photo">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let s">
              <img *ngIf="s.photoUrl" [src]="s.photoUrl" style="width:40px; height:40px; border-radius:6px; object-fit:cover" />
            </td>
          </ng-container>
          <ng-container matColumnDef="name">
            <th class="bold" style="color:black" mat-header-cell *matHeaderCellDef>Nombre</th>
            <td style="color:black" mat-cell *matCellDef="let s">{{s.name}}</td>
          </ng-container>
          <ng-container matColumnDef="rarity">
            <th class="bold" style="color:black" mat-header-cell *matHeaderCellDef>Rareza</th>
            <td style="color:black" mat-cell *matCellDef="let s">{{s.rarity}}</td>
          </ng-container>
          <ng-container matColumnDef="price">
            <th class="bold" style="color:black" mat-header-cell *matHeaderCellDef>Precio</th>
            <td style="color:black" mat-cell *matCellDef="let s">${{s.price}}</td>
          </ng-container>
          <ng-container matColumnDef="category">
            <th class="bold" style="color:black" mat-header-cell *matHeaderCellDef>Categoría</th>
            <td style="color:black" mat-cell *matCellDef="let s">{{s.category.name}}</td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let s">
              <button mat-icon-button (click)="editSkin(s)" aria-label="Editar"><mat-icon>edit</mat-icon></button>
              <button mat-icon-button (click)="deleteSkin(s.id)" aria-label="Eliminar"><mat-icon>delete</mat-icon></button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="['photo', 'name', 'rarity', 'price', 'category', 'actions']"></tr>
          <tr mat-row *matRowDef="let row; columns: ['photo', 'name', 'rarity', 'price', 'category', 'actions'];"></tr>
        </table>
      </div>
    </mat-tab>
  </mat-tab-group>
</div>
